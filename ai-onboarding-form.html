<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vAI — Get Started</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:           #F7F6F3;
  --surface:      #FFFFFF;
  --border:       #E4E2DC;
  --border-hover: #C8C4BC;
  --text:         #1A1A18;
  --text-muted:   #706F6A;
  --text-faint:   #AAA9A4;
  --accent:       #5D5CE8;
  --accent-light: #EEEEFD;
  --accent-border:rgba(93,92,232,0.28);
  --accent-glow:  rgba(93,92,232,0.10);
  --red:          #DC2626;
  --red-light:    #FEF2F2;
  --red-border:   rgba(220,38,38,0.2);
  --green:        #16A34A;
  --green-light:  #F0FDF4;
  --orange:       #D97706;
  --shadow-sm:    0 1px 4px rgba(0,0,0,0.06),0 2px 8px rgba(0,0,0,0.04);
  --shadow-md:    0 4px 16px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04);
  --radius:       10px;
  --radius-lg:    14px;
  --radius-xl:    18px;
}
html,body { height:100%; font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }

/* ─── LAYOUT ─── */
.shell { display:flex; flex-direction:column; min-height:100vh; }

/* ─── HEADER ─── */
.header { position:sticky; top:0; z-index:100; background:rgba(247,246,243,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 2rem; height:58px; display:flex; align-items:center; }
.header-inner { display:flex; align-items:center; gap:2rem; width:100%; max-width:920px; margin:0 auto; }
.logo { font-size:15px; font-weight:800; letter-spacing:-0.3px; color:var(--text); }
.logo span { color:var(--accent); }
.progress-wrap { flex:1; display:flex; align-items:center; gap:1rem; }
.progress-bar-outer { flex:1; height:3px; background:var(--border); border-radius:99px; overflow:hidden; max-width:240px; }
.progress-bar-fill { height:100%; background:var(--accent); border-radius:99px; transition:width 0.4s cubic-bezier(.4,0,.2,1); }
.progress-label { font-size:12px; font-weight:600; color:var(--text-muted); white-space:nowrap; }
.phase-badge { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:3px 9px; border-radius:99px; }
.phase-badge.mandatory { background:var(--red-light); color:var(--red); border:1px solid var(--red-border); }
.phase-badge.optional  { background:var(--accent-light); color:var(--accent); border:1px solid var(--accent-border); }
.phase-badge.ai        { background:#FFF7ED; color:var(--orange); border:1px solid rgba(217,119,6,0.3); }

/* ─── MAIN ─── */
.main { flex:1; display:flex; flex-direction:column; align-items:center; padding:3.5rem 1.5rem 7rem; }
.step-wrap { width:100%; max-width:620px; }
.step-content { animation:stepIn 0.28s cubic-bezier(.4,0,.2,1); }
@keyframes stepIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* ─── STEP HEADER ─── */
.step-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--text-faint); margin-bottom:0.75rem; }
.step-heading { font-size:1.65rem; font-weight:800; color:var(--text); line-height:1.25; letter-spacing:-0.4px; margin-bottom:0.5rem; }
.step-sub { font-size:13.5px; color:var(--text-muted); margin-bottom:2rem; line-height:1.6; max-width:500px; }
.required-notice { display:flex; align-items:center; gap:7px; background:var(--red-light); border:1px solid var(--red-border); border-radius:8px; padding:8px 12px; margin-bottom:1.25rem; font-size:12px; color:var(--red); font-weight:600; }

/* ─── INPUT BASE ─── */
.field-label { font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
.field-input { width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:13px 16px; font-family:inherit; font-size:15px; color:var(--text); outline:none; transition:all 0.2s; }
.field-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.field-input::placeholder { color:var(--text-faint); }
.field-hint { font-size:12px; color:var(--text-faint); margin-top:6px; }
textarea.field-input { resize:vertical; min-height:110px; line-height:1.6; }
.other-text-row { margin-top:12px; }

/* ─── OPTION CARDS ─── */
.options-grid { display:flex; flex-direction:column; gap:9px; margin-top:0.25rem; }
.options-grid.two-col { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.options-grid.three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
.opt-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.1rem; cursor:pointer; transition:all 0.18s; display:flex; align-items:flex-start; gap:12px; }
.opt-card:hover { border-color:var(--border-hover); box-shadow:var(--shadow-sm); }
.opt-card.selected { border-color:var(--accent); background:var(--accent-light); box-shadow:0 0 0 3px var(--accent-glow); }
.opt-card-icon { font-size:20px; width:40px; height:40px; background:var(--bg); border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opt-card.selected .opt-card-icon { background:rgba(93,92,232,0.12); }
.opt-card-body { flex:1; min-width:0; }
.opt-card-label { font-size:14px; font-weight:700; color:var(--text); }
.opt-card-desc { font-size:12px; color:var(--text-muted); margin-top:2px; line-height:1.4; }
.opt-card-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px; transition:all 0.18s; display:flex; align-items:center; justify-content:center; }
.opt-card.selected .opt-card-check { background:var(--accent); border-color:var(--accent); }
.opt-card.selected .opt-card-check::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; }

/* ─── CHIPS ─── */
.chips-field { display:flex; flex-wrap:wrap; gap:8px; }
.chip-opt { display:flex; align-items:center; gap:7px; padding:8px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:99px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; transition:all 0.15s; font-family:inherit; }
.chip-opt:hover { border-color:var(--border-hover); color:var(--text); }
.chip-opt.selected { background:var(--accent-light); border-color:var(--accent-border); color:var(--accent); font-weight:600; }
.chip-check { font-size:10px; display:none; font-weight:700; }
.chip-opt.selected .chip-check { display:inline; }

/* ─── YES / NO ─── */
.yes-no-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:0.25rem; }
.yn-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); padding:1.5rem 1.25rem; cursor:pointer; transition:all 0.18s; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
.yn-card:hover { border-color:var(--border-hover); box-shadow:var(--shadow-md); transform:translateY(-2px); }
.yn-card.selected { border-color:var(--accent); background:var(--accent-light); box-shadow:0 0 0 3px var(--accent-glow); }
.yn-icon { font-size:2rem; }
.yn-label { font-size:15px; font-weight:700; color:var(--text); }

/* ─── PLATFORM HANDLES ─── */
.platforms-list { display:flex; flex-direction:column; gap:10px; }
.platform-row { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; transition:border-color 0.2s; }
.platform-row.checked { border-color:var(--accent); }
.platform-toggle { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
.platform-checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.18s; }
.platform-row.checked .platform-checkbox { background:var(--accent); border-color:var(--accent); }
.platform-row.checked .platform-checkbox::after { content:'✓'; color:#fff; font-size:11px; font-weight:700; }
.platform-icon-label { display:flex; align-items:center; gap:8px; flex:1; }
.platform-emoji { font-size:18px; }
.platform-name { font-size:13.5px; font-weight:600; color:var(--text); }
.platform-handle-wrap { display:none; padding:0 16px 12px; animation:fadeIn 0.2s ease; }
.platform-row.checked .platform-handle-wrap { display:flex; align-items:center; gap:8px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
.platform-prefix { font-size:12.5px; font-weight:600; color:var(--text-muted); white-space:nowrap; }
.platform-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:8px 12px; font-family:inherit; font-size:13.5px; color:var(--text); outline:none; transition:all 0.2s; }
.platform-input:focus { border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 2px var(--accent-glow); }
.platform-input::placeholder { color:var(--text-faint); }

/* ─── FILE UPLOAD ─── */
.upload-zone { border:2px dashed var(--border); border-radius:var(--radius-lg); padding:2rem; text-align:center; background:var(--surface); transition:all 0.2s; cursor:pointer; }
.upload-zone:hover, .upload-zone.dragover { border-color:var(--accent); background:var(--accent-light); }
.upload-icon { font-size:2.5rem; margin-bottom:0.75rem; }
.upload-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
.upload-sub { font-size:12px; color:var(--text-muted); margin-bottom:1rem; }
.upload-btn { display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--accent); background:var(--accent-light); border:1.5px solid var(--accent-border); padding:7px 16px; border-radius:7px; cursor:pointer; transition:all 0.15s; }
.upload-btn:hover { background:var(--accent); color:#fff; }
.upload-formats { font-size:11px; color:var(--text-faint); margin-top:0.75rem; }
.file-previews { display:flex; flex-wrap:wrap; gap:10px; margin-top:1rem; }
.file-preview-item { position:relative; }
.file-preview-img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
.file-preview-doc { width:72px; height:72px; background:var(--bg); border:1px solid var(--border); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.file-doc-icon { font-size:22px; }
.file-doc-name { font-size:9px; color:var(--text-muted); text-align:center; padding:0 4px; word-break:break-all; line-height:1.2; max-width:72px; }
.file-remove { position:absolute; top:-6px; right:-6px; width:18px; height:18px; background:var(--red); color:#fff; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700; border:2px solid var(--surface); }
.file-count-label { font-size:12px; color:var(--text-muted); margin-top:8px; }

/* ─── INDUSTRY GRID ─── */
.ind-search { display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:1rem; transition:border-color 0.2s; }
.ind-search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.ind-search input { border:none; outline:none; font-family:inherit; font-size:13.5px; color:var(--text); background:transparent; flex:1; }
.ind-search input::placeholder { color:var(--text-faint); }
.cat-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.25rem; }
.cat-tag { font-size:12px; font-weight:500; padding:5px 13px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; font-family:inherit; transition:all 0.15s; }
.cat-tag:hover { border-color:var(--border-hover); color:var(--text); }
.cat-tag.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.ind-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-bottom:1.25rem; }
.ind-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem; cursor:pointer; transition:all 0.18s; display:flex; flex-direction:column; gap:6px; }
.ind-card:hover { border-color:var(--border-hover); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.ind-card.selected { border-color:var(--accent); background:var(--accent-light); box-shadow:0 0 0 3px var(--accent-glow); }
.ind-card.other-card { border-style:dashed; }
.ind-emoji { font-size:22px; width:42px; height:42px; background:var(--bg); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.ind-card.selected .ind-emoji { background:rgba(93,92,232,0.12); }
.ind-name { font-size:13px; font-weight:700; color:var(--text); line-height:1.3; }
.ind-cat { font-size:10.5px; font-weight:500; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; }
.other-input-wrap { background:var(--surface); border:1.5px solid var(--accent); border-radius:var(--radius); padding:12px 14px; margin-top:4px; display:none; }
.other-input-wrap.show { display:block; }
.other-input { width:100%; border:none; outline:none; font-family:inherit; font-size:14px; color:var(--text); background:transparent; }
.other-input::placeholder { color:var(--text-faint); }
.ind-footer { display:flex; align-items:center; justify-content:space-between; padding-top:0.5rem; }
.ind-sel-label { font-size:13px; color:var(--text-muted); }
.ind-sel-label strong { color:var(--text); }
.btn-ind-continue { font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--text); border:none; padding:13px 32px; border-radius:10px; cursor:pointer; transition:all 0.18s; opacity:0.3; pointer-events:none; }
.btn-ind-continue.enabled { opacity:1; pointer-events:all; }
.btn-ind-continue.enabled:hover { background:#000; transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.15); }

/* ─── FOOTER ─── */
.footer { position:fixed; bottom:0; left:0; right:0; background:rgba(247,246,243,0.95); backdrop-filter:blur(12px); border-top:1px solid var(--border); padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; z-index:100; }
.btn-back { font-family:inherit; font-size:14px; font-weight:600; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:10px 4px; display:flex; align-items:center; gap:6px; transition:color 0.15s; }
.btn-back:hover { color:var(--text); }
.footer-right { display:flex; align-items:center; gap:12px; }
.btn-skip-step { font-family:inherit; font-size:13px; font-weight:500; color:var(--text-faint); background:none; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; padding:10px 16px; transition:all 0.15s; }
.btn-skip-step:hover { color:var(--text-muted); border-color:var(--border-hover); }
.btn-continue { font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--text); border:none; padding:12px 28px; border-radius:10px; cursor:pointer; transition:all 0.18s; display:flex; align-items:center; gap:8px; }
.btn-continue:hover { background:#000; transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.15); }
.btn-continue:disabled { opacity:0.3; pointer-events:none; }

/* ─── AI PROCESSING ─── */
.ai-processing-wrap { text-align:center; padding:3rem 0 2rem; }
.ai-spinner { width:56px; height:56px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin 0.9s linear infinite; margin:0 auto 1.5rem; }
@keyframes spin { to { transform:rotate(360deg); } }
.ai-processing-title { font-size:1.4rem; font-weight:800; color:var(--text); margin-bottom:0.5rem; }
.ai-processing-sub { font-size:13.5px; color:var(--text-muted); max-width:380px; margin:0 auto 2rem; }
.ai-steps-list { display:flex; flex-direction:column; gap:10px; max-width:360px; margin:0 auto; text-align:left; }
.ai-step-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; transition:all 0.4s; }
.ai-step-item.done { background:var(--green-light); color:var(--green); }
.ai-step-item.active { background:var(--accent-light); color:var(--accent); }
.ai-step-item.pending { background:var(--surface); color:var(--text-faint); border:1.5px solid var(--border); }
.ai-step-icon { font-size:16px; width:24px; text-align:center; }

/* ─── SECTION INTRO ─── */
.section-intro-wrap { text-align:center; padding:2rem 0; }
.section-num-pill { display:inline-flex; align-items:center; gap:6px; background:var(--accent-light); color:var(--accent); border:1px solid var(--accent-border); border-radius:99px; padding:5px 14px; font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:1.5rem; }
.section-intro-icon { font-size:3rem; margin-bottom:1rem; }
.section-q-count { display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1.5px solid var(--border); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:600; color:var(--text-muted); margin-top:0.5rem; }

/* ─── SECTION QUESTION EYEBROW ─── */
.section-crumb { display:flex; align-items:center; gap:6px; margin-bottom:0.75rem; flex-wrap:wrap; }
.section-crumb-item { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); }
.section-crumb-sep { color:var(--text-faint); font-size:10px; }

/* ─── WEBSITE PREVIEW ─── */
.preview-browser { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); overflow:hidden; box-shadow:var(--shadow-md); margin-bottom:2rem; }
.preview-chrome { background:#EFEEEA; border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:10px; }
.preview-dots { display:flex; gap:5px; }
.preview-dot { width:10px; height:10px; border-radius:50%; }
.preview-dot.r { background:#FF5F57; }
.preview-dot.y { background:#FFBD2E; }
.preview-dot.g { background:#28C840; }
.preview-urlbar { flex:1; background:var(--surface); border-radius:6px; padding:4px 12px; font-size:11px; color:var(--text-muted); font-weight:500; display:flex; align-items:center; gap:5px; }
.preview-site { font-size:11px; line-height:1.4; }
.site-nav { background:#1A1A18; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; }
.site-nav-logo { color:#fff; font-weight:800; font-size:12px; letter-spacing:-0.3px; }
.site-nav-links { display:flex; gap:10px; align-items:center; }
.site-nav-link { color:rgba(255,255,255,0.55); font-size:9.5px; font-weight:500; }
.site-nav-cta { background:var(--accent); color:#fff; font-size:9px; font-weight:700; padding:4px 10px; border-radius:5px; }
.site-hero { background:linear-gradient(135deg,#5D5CE8 0%,#7C7BF0 50%,#9E9DF5 100%); padding:32px 24px; text-align:center; }
.site-hero-eyebrow { color:rgba(255,255,255,0.7); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
.site-hero-h { color:#fff; font-size:18px; font-weight:800; line-height:1.2; margin-bottom:8px; letter-spacing:-0.3px; }
.site-hero-sub { color:rgba(255,255,255,0.82); font-size:10px; line-height:1.6; max-width:340px; margin:0 auto 16px; }
.site-hero-cta { display:inline-block; background:#fff; color:#5D5CE8; font-size:10px; font-weight:700; padding:8px 18px; border-radius:7px; }
.site-section { padding:18px 22px; border-bottom:1px solid var(--border); }
.site-section.alt { background:#FAFAF8; }
.site-section-eyebrow { font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-faint); margin-bottom:5px; }
.site-section-title { font-size:14px; font-weight:800; color:var(--text); margin-bottom:6px; }
.site-section-body { font-size:10px; color:var(--text-muted); line-height:1.6; }
.site-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px; }
.site-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 8px; text-align:center; }
.site-card-icon { font-size:14px; margin-bottom:3px; }
.site-card-label { font-size:9px; font-weight:700; color:var(--text); line-height:1.3; }
.site-testimonials { background:#F4F3FF; padding:18px 22px; border-bottom:1px solid var(--border); }
.site-testimonial { background:var(--surface); border-radius:9px; padding:12px; border:1px solid rgba(93,92,232,0.15); }
.site-stars { color:#F59E0B; font-size:11px; margin-bottom:4px; }
.site-testimonial-text { font-size:10px; color:var(--text-muted); line-height:1.5; font-style:italic; }
.site-testimonial-name { font-size:9px; font-weight:700; color:var(--text); margin-top:6px; }
.site-faq { padding:18px 22px; border-bottom:1px solid var(--border); background:var(--bg); }
.site-faq-item { padding:8px 0; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:8px; }
.site-faq-item:last-child { border-bottom:none; }

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let state = {
  phase:'contact',   // 'contact'|'industry'|'ai_processing'|'sections'|'preview'|'complete'
  contactIdx:0,
  industry:null,
  sectionIdx:0,
  questionIdx:-1,    // -1 = section intro screen, 0+ = question index within section
  sections:[],       // AI-generated + SHARED_SECTIONS
  answers:{},
  skipped:new Set(),
  uploadedFiles:{},
  otherInputs:{},
  startTime:null,
  aiGenerated:false,
};
let indSelected=null, indSearch='', indCat='All', otherText='';

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function init(){
  state.startTime = Date.now();
  showContactStep();
}

// ═══════════════════════════════════════════════════════
//  CONTACT PHASE
// ═══════════════════════════════════════════════════════
function showContactStep(){
  state.phase = 'contact';
  const q = MANDATORY_Q[state.contactIdx];
  document.getElementById('headerProgress').style.display = 'flex';
  document.getElementById('footerNav').style.display = 'flex';
  updateProgressBar(state.contactIdx, MANDATORY_Q.length + 1, 'mandatory');

  const saved = state.answers[q.id] || '';
  const html = `<div class="step-content">
    <div style="margin-bottom:1.75rem">
      <div class="step-eyebrow">${esc(q.category)}</div>
      <h1 class="step-heading">${esc(q.question)}</h1>
      ${q.sub ? `<p class="step-sub">${esc(q.sub)}</p>` : ''}
      ${!q.skippable ? `<div class="required-notice">🔒 Required — this field cannot be skipped</div>` : ''}
    </div>
    ${q.type==='textarea'
      ? `<textarea class="field-input" id="qInput" placeholder="${esc(q.placeholder||'')}" oninput="onContactInput()">${esc(saved)}</textarea>`
      : `<input class="field-input" id="qInput" type="${q.type||'text'}" placeholder="${esc(q.placeholder||'')}" value="${esc(saved)}" oninput="onContactInput()">`
    }
  </div>`;
  document.getElementById('stepWrap').innerHTML = html;
  document.getElementById('btnBack').style.display = state.contactIdx===0 ? 'none' : '';
  document.getElementById('btnSkip').style.display = q.skippable ? '' : 'none';
  document.getElementById('btnSkip').textContent = 'Skip this step';
  updateContinueState(q);
  setTimeout(()=>document.getElementById('qInput')?.focus(), 80);
}

function onContactInput(){
  const q = MANDATORY_Q[state.contactIdx];
  state.answers[q.id] = document.getElementById('qInput').value.trim();
  updateContinueState(q);
}

// ═══════════════════════════════════════════════════════
//  INDUSTRY SELECTION
// ═══════════════════════════════════════════════════════
function showIndustryScreen(){
  state.phase = 'industry';
  document.getElementById('footerNav').style.display = 'none';
  document.getElementById('phaseBadge').className = 'phase-badge optional';
  document.getElementById('phaseBadge').textContent = 'Optional';
  updateProgressBar(MANDATORY_Q.length, MANDATORY_Q.length + 1, 'optional');

  const cats = ['All',...[...new Set(INDUSTRIES.map(i=>i.cat))].sort()];
  const filtered = INDUSTRIES.filter(i=>{
    const mc = indCat==='All'||i.cat===indCat;
    const ms = !indSearch||i.name.toLowerCase().includes(indSearch.toLowerCase());
    return mc&&ms;
  });

  const html = `<div class="step-content">
    <div style="margin-bottom:2rem">
      <div class="step-eyebrow">About your business</div>
      <h1 class="step-heading">What industry are you in?</h1>
      <p class="step-sub">Our AI will use this together with your business description to generate a tailored website blueprint.</p>
    </div>
    <div class="ind-search">
      <span style="color:var(--text-faint)">🔍</span>
      <input type="text" placeholder="Search industries…" value="${esc(indSearch)}" oninput="onIndSearch(this.value)" autocomplete="off">
    </div>
    <div class="cat-row">
      ${cats.map(c=>`<button class="cat-tag ${c===indCat?'active':''}" onclick="onIndCat('${c}')">${c}</button>`).join('')}
    </div>
    ${filtered.length ? `<div class="ind-grid">
      ${filtered.map(i=>`
        <div class="ind-card ${i.name==='Other'?'other-card':''} ${indSelected&&indSelected.name===i.name?'selected':''}" onclick="onIndSelect('${i.name}')">
          <div class="ind-emoji">${i.emoji}</div>
          <div class="ind-name">${i.name}</div>
          <div class="ind-cat">${i.cat}</div>
        </div>`).join('')}
    </div>` : '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:13px">No industries match your search.</div>'}
    ${indSelected&&indSelected.name==='Other' ? `
      <div class="other-input-wrap show" style="margin-bottom:1rem">
        <input class="other-input" placeholder="Describe your industry or business type…" value="${esc(otherText)}" oninput="otherText=this.value" autofocus>
      </div>` : ''}
    <div class="ind-footer">
      <div class="ind-sel-label">${indSelected ? `Selected: <strong>${indSelected.emoji} ${indSelected.name==='Other'&&otherText ? otherText : indSelected.name}</strong>` : 'Choose your industry above'}</div>
      <button class="btn-ind-continue ${indSelected?'enabled':''}" onclick="startAIFlow()">Analyse my business →</button>
    </div>
  </div>`;
  document.getElementById('stepWrap').innerHTML = html;
}

function onIndSearch(v){ indSearch=v; showIndustryScreen(); }
function onIndCat(c){ indCat=c; showIndustryScreen(); }
function onIndSelect(name){
  indSelected = INDUSTRIES.find(i=>i.name===name);
  if(name!=='Other') otherText='';
  showIndustryScreen();
}

// ═══════════════════════════════════════════════════════
//  AI PROCESSING
// ═══════════════════════════════════════════════════════
function startAIFlow(){
  if(!indSelected) return;
  state.industry = {...indSelected, displayName: indSelected.name==='Other'&&otherText ? otherText : indSelected.name};
  state.answers['industry'] = state.industry.displayName;
  state.phase = 'ai_processing';
  document.getElementById('footerNav').style.display = 'none';
  document.getElementById('phaseBadge').className = 'phase-badge ai';
  document.getElementById('phaseBadge').textContent = 'AI';
  showAIProcessing();
  callClaudeForSections();
}

function showAIProcessing(){
  const bizName = state.answers['registered_name'] || 'your business';
  const steps = [
    {icon:'✓', label:'Business profile understood', state:'done'},
    {icon:'◌', label:'Identifying website sections…', state:'active'},
    {icon:'◌', label:'Generating personalised questions', state:'pending'},
  ];
  const html = `<div class="step-content">
    <div class="ai-processing-wrap">
      <div class="ai-spinner"></div>
      <div class="ai-processing-title">Analysing your business…</div>
      <p class="ai-processing-sub">Our AI is reviewing <strong>${esc(bizName)}</strong> and building a personalised website blueprint.</p>
      <div class="ai-steps-list" id="aiStepsList">
        ${steps.map((s,i)=>`<div class="ai-step-item ${s.state}" id="aiStep${i}">
          <span class="ai-step-icon">${s.icon}</span>
          <span>${s.label}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
  document.getElementById('stepWrap').innerHTML = html;
  updateProgressBar(MANDATORY_Q.length + 1, MANDATORY_Q.length + 2, 'optional');
}

function updateAIStep(stepIdx){
  [0,1,2].forEach(i => {
    const el = document.getElementById('aiStep'+i);
    if(!el) return;
    if(i < stepIdx){ el.className='ai-step-item done'; el.querySelector('.ai-step-icon').textContent='✓'; }
    else if(i===stepIdx){ el.className='ai-step-item active'; el.querySelector('.ai-step-icon').textContent='→'; }
    else { el.className='ai-step-item pending'; }
  });
}

async function callClaudeForSections(){
  const bizName = state.answers['registered_name'] || '';
  const bizDesc = state.answers['biz_description'] || '';
  const industry = state.industry.displayName;

  const systemPrompt = `You are a senior website architect and digital onboarding expert at vAI, a web agency that builds high-converting websites for businesses.

A business owner has registered and shared their details. You must:
1. Identify exactly which sections their website should have based on their industry and description
2. Generate smart, specific questions per section to gather all the content needed to build each one

MANDATORY SECTIONS (always include, in this order):
① Hero / Banner — headline, value proposition, primary CTA, hero image guidance
② About Us — origin story, founder, mission, what makes them unique, team
③ [Industry-specific sections — see below]
④ Testimonials & Social Proof — client quotes, case studies, star ratings
⑤ FAQ — common questions specific to their business and industry
⑥ Contact & Location — address, hours, enquiry form fields

ADD THESE SECTIONS WHEN RELEVANT TO THE INDUSTRY:
• "Services" → service-based businesses (salons, clinics, agencies, consulting, home services, coaching)
• "Products / Catalogue" → retail, trading, manufacturing, FMCG, e-commerce
• "Menu" → restaurants, cafes, bakeries, bars, food & beverage
• "Portfolio / Work Gallery" → photography, interior design, architecture, creative agencies, tattoo studios
• "Property Listings" → real estate developers, brokers, agents, property management
• "Team / Experts" → clinics, hospitals, law firms, multi-doctor practices, schools, large agencies
• "Pricing & Packages" → SaaS, gyms, coaching, salons, tutoring, agencies
• "Events / Schedule" → gyms, music schools, event management, hospitality venues
• "Blog / Resources" → education, healthcare, finance, agencies, NGOs
• "Awards & Press" → established brands, funded startups, award-winning businesses

QUESTION RULES:
• 3–5 questions per section, all with skippable: true
• Be SPECIFIC to this exact business — use their industry, name, and description as context
• Every question must map directly to actual website content
• Available types: "text", "textarea", "single_select", "multi_chips", "yes_no"
• For single_select and multi_chips: provide 4–6 relevant options with emoji icons
• Question IDs must be unique lowercase_snake_case strings

CRITICAL: Return ONLY raw JSON. No markdown, no explanation, no code fences. Start with { end with }.

Format:
{"sections":[{"id":"hero","title":"Hero Section","icon":"🎯","description":"The first thing visitors see — your headline and main call to action","questions":[{"id":"hero_tagline","type":"text","category":"Hero Section","question":"What's your main headline or tagline?","sub":"5–10 punchy words that capture what you do","placeholder":"e.g., Bengaluru's Most Trusted Property Partner","skippable":true}]}]}`;

  const userMsg = `Business Name: ${bizName}
Industry: ${industry}
Description: ${bizDesc}

Generate the website sections and questions for this specific business.`;

  try {
    setTimeout(()=>updateAIStep(1), 800);

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:4096,
        system: systemPrompt,
        messages:[{role:'user', content:userMsg}],
      }),
    });

    if(!resp.ok) throw new Error('API error '+resp.status);
    const data = await resp.json();
    const raw = data.content[0].text.trim();

    setTimeout(()=>updateAIStep(2), 400);

    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('No JSON in response');
    const parsed = JSON.parse(jsonMatch[0]);
    if(!parsed.sections || !Array.isArray(parsed.sections)) throw new Error('Bad sections');

    setTimeout(()=>{
      state.sections = [...parsed.sections, ...SHARED_SECTIONS];
      state.aiGenerated = true;
      state.sectionIdx = 0;
      state.questionIdx = -1;
      state.phase = 'sections';
      document.getElementById('footerNav').style.display = 'flex';
      document.getElementById('phaseBadge').className = 'phase-badge optional';
      document.getElementById('phaseBadge').textContent = 'Optional';
      animateAndRun(showSectionIntro);
    }, 700);

  } catch(err){
    console.warn('Claude API error, using fallback:', err.message);
    setTimeout(()=>fallbackToStaticSections(), 600);
  }
}

  document.getElementById('btnSkip').style.display = '';

// ═══════════════════════════════════════════════════════
//  SECTION QUESTION SCREEN
// ═══════════════════════════════════════════════════════
function showSectionQuestion(){
  const section = state.sections[state.sectionIdx];

  // Skip showIfAnswer mismatches
  while(state.questionIdx < section.questions.length){
    const q = section.questions[state.questionIdx];
    if(q.showIfAnswer){
      const dep = state.answers[q.showIfAnswer.id];
      if(dep !== q.showIfAnswer.value){ state.questionIdx++; continue; }
    }
    break;
  }
  // End of section — advance
  if(state.questionIdx >= section.questions.length){ goForward(); return; }

  const q = section.questions[state.questionIdx];
  updateProgressBar(getSectionProgress(), getTotalProgressSteps(), 'optional');

  document.getElementById('btnBack').style.display = '';
  document.getElementById('btnSkip').style.display = (q.skippable===false||q.required) ? 'none' : '';
  document.getElementById('btnSkip').textContent = 'Skip this step';

  let body = '';
  if(['text','email','tel','url'].includes(q.type)){
    body = `<input class="field-input" id="qInput" type="${q.type}" placeholder="${esc(q.placeholder||'')}" value="${esc(state.answers[q.id]||'')}" oninput="onTextQ('${q.id}')">
            ${q.sub?`<div class="field-hint" style="margin-top:6px">${esc(q.sub)}</div>`:''}`;
  } else if(q.type==='textarea'){
    body = `<textarea class="field-input" id="qInput" placeholder="${esc(q.placeholder||'')}" oninput="onTextQ('${q.id}')">${esc(state.answers[q.id]||'')}</textarea>
            ${q.sub?`<div class="field-hint" style="margin-top:6px">${esc(q.sub)}</div>`:''}`;
  } else if(q.type==='single_select'){
    const opts = q.options.find(o=>o.label==='Other') ? q.options : [...q.options,{icon:"✏️",label:"Other",desc:"Not listed above"}];
    const cols = opts.length<=2?'two-col':opts.length>=6?'three-col':'';
    const isOther = state.answers[q.id]==='Other';
    body = `<div class="options-grid ${cols}">
      ${opts.map(o=>`<div class="opt-card ${state.answers[q.id]===o.label?'selected':''}" onclick="selectOpt('${q.id}','${esc(o.label)}')">
        <div class="opt-card-icon">${o.icon||'•'}</div>
        <div class="opt-card-body"><div class="opt-card-label">${esc(o.label)}</div>${o.desc?`<div class="opt-card-desc">${esc(o.desc)}</div>`:''}</div>
        <div class="opt-card-check"></div>
      </div>`).join('')}
    </div>
    <div class="other-text-row" id="other-row-${q.id}" style="display:${isOther?'block':'none'}">
      <input class="field-input" id="other-input-${q.id}" placeholder="Please describe…" value="${esc(state.otherInputs[q.id]||'')}" oninput="onOtherInput('${q.id}',this.value)">
    </div>`;
  } else if(q.type==='multi_chips'){
    const saved = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
    const opts = q.options.find(o=>o.label==='Other') ? q.options : [...q.options,{icon:"✏️",label:"Other"}];
    const hasOther = saved.includes('Other');
    body = `<div class="chips-field" style="margin-top:0.25rem">
      ${opts.map(o=>`<button class="chip-opt ${saved.includes(o.label)?'selected':''}" onclick="toggleChipQ('${q.id}',this,'${esc(o.label)}')">
        <span>${o.icon||''}</span>${esc(o.label)}<span class="chip-check">✓</span>
      </button>`).join('')}
    </div>
    <div class="other-text-row" id="other-row-${q.id}" style="display:${hasOther?'block':'none'}">
      <input class="field-input" id="other-input-${q.id}" placeholder="Please describe…" value="${esc(state.otherInputs[q.id]||'')}" oninput="onOtherInput('${q.id}',this.value)">
    </div>
    ${q.sub?`<div class="field-hint" style="margin-top:10px">${esc(q.sub)}</div>`:''}`;
  } else if(q.type==='yes_no'){
    body = `<div class="yes-no-row">
      <div class="yn-card ${state.answers[q.id]==='yes'?'selected':''}" onclick="selectYN('${q.id}','yes')">
        <div class="yn-icon">${q.yes_icon||'✅'}</div>
        <div class="yn-label">${esc(q.yes_label||'Yes')}</div>
      </div>
      <div class="yn-card ${state.answers[q.id]==='no'?'selected':''}" onclick="selectYN('${q.id}','no')">
        <div class="yn-icon">${q.no_icon||'❌'}</div>
        <div class="yn-label">${esc(q.no_label||'No')}</div>
      </div>
    </div>`;
  } else if(q.type==='platforms_handles'){
    body = renderPlatformsHandles();
  } else if(q.type==='file_upload'){
    body = renderFileUpload(q);
  }

  const html = `<div class="step-content">
    <div style="margin-bottom:1.75rem">
      <div class="section-crumb">
        <span class="section-crumb-item">${esc(section.icon)} ${esc(section.title)}</span>
        <span class="section-crumb-sep">›</span>
        <span class="section-crumb-item">${esc(q.category||'')}</span>
      </div>
      <h1 class="step-heading">${esc(q.question)}</h1>
      ${q.sub&&!['multi_chips','platforms_handles','file_upload','textarea','text','email','tel','url'].includes(q.type)?`<p class="step-sub">${esc(q.sub)}</p>`:''}
    </div>
    ${body}
  </div>`;
  document.getElementById('stepWrap').innerHTML = html;
  bindFileUploadEvents(q);
  updateContinueState(q);
  if(['text','email','tel','url'].includes(q.type)||q.type==='textarea')
    setTimeout(()=>document.getElementById('qInput')?.focus(), 80);
}

function renderPlatformsHandles(){
  const saved = state.answers['online_presence'] || {};
  return `<div class="platforms-list">
    ${PLATFORMS.map(p=>{
      const isChecked = !!saved[p.id];
      return `<div class="platform-row ${isChecked?'checked':''}" id="prow-${p.id}">
        <div class="platform-toggle" onclick="togglePlatform('${p.id}')">
          <div class="platform-checkbox" id="pcheck-${p.id}"></div>
          <div class="platform-icon-label">
            <span class="platform-emoji">${p.emoji}</span>
            <span class="platform-name">${p.label}</span>
          </div>
        </div>
        <div class="platform-handle-wrap" id="phandle-${p.id}">
          ${p.prefix?`<span class="platform-prefix">${p.prefix}</span>`:''}
          <input class="platform-input" id="pinput-${p.id}" placeholder="${p.placeholder}" value="${esc(saved[p.id]||'')}" oninput="updateHandle('${p.id}',this.value)">
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function togglePlatform(pid){
  const row = document.getElementById('prow-'+pid);
  const isOn = row.classList.contains('checked');
  row.classList.toggle('checked');
  const saved = state.answers['online_presence'] || {};
  if(!isOn){ saved[pid]=''; setTimeout(()=>document.getElementById('pinput-'+pid)?.focus(),80); }
  else delete saved[pid];
  state.answers['online_presence'] = saved;
}
function updateHandle(pid, val){ const s=state.answers['online_presence']||{}; s[pid]=val; state.answers['online_presence']=s; }

// ═══════════════════════════════════════════════════════
//  FILE UPLOAD RENDERER
// ═══════════════════════════════════════════════════════
function renderFileUpload(q){
  const files = state.uploadedFiles[q.id] || [];
  const previewsHtml = files.map((f,i)=>{
    const isImg = f.type.startsWith('image/');
    if(isImg){ const url=URL.createObjectURL(f); return `<div class="file-preview-item"><img class="file-preview-img" src="${url}" alt="${esc(f.name)}"><div class="file-remove" onclick="removeFile('${q.id}',${i})">×</div></div>`; }
    const ext=f.name.split('.').pop().toUpperCase();
    return `<div class="file-preview-item"><div class="file-preview-doc"><div class="file-doc-icon">📄</div><div class="file-doc-name">.${ext}<br>${esc(f.name.slice(0,14))}</div></div><div class="file-remove" onclick="removeFile('${q.id}',${i})">×</div></div>`;
  }).join('');
  return `<div class="upload-zone" id="dropzone-${q.id}" onclick="triggerFilePick('${q.id}')">
    <div class="upload-icon">📁</div>
    <div class="upload-title">Drop files here or click to browse</div>
    ${q.sub?`<div class="upload-sub">${esc(q.sub)}</div>`:''}
    <div class="upload-btn">Browse files</div>
    <div class="upload-formats">${q.accept||'All files accepted'}</div>
    ${previewsHtml?`<div class="file-previews" id="previews-${q.id}" onclick="event.stopPropagation()">${previewsHtml}</div>`:''}
    ${files.length?`<div class="file-count-label">${files.length} file${files.length>1?'s':''} selected</div>`:''}
  </div>
  <input type="file" id="fileinput-${q.id}" ${q.multiple?'multiple':''} accept="${q.accept||'*'}" style="display:none" onchange="onFilesSelected('${q.id}',this)">`;
}
function bindFileUploadEvents(q){
  if(q.type!=='file_upload') return;
  const zone = document.getElementById('dropzone-'+q.id);
  if(!zone) return;
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');addFiles(q.id,[...e.dataTransfer.files]);});
}
function triggerFilePick(qid){ document.getElementById('fileinput-'+qid)?.click(); }
function onFilesSelected(qid, input){ addFiles(qid,[...input.files]); }
function addFiles(qid, newFiles){
  if(!state.uploadedFiles[qid]) state.uploadedFiles[qid]=[];
  state.uploadedFiles[qid].push(...newFiles);
  const q = getAllQuestions().find(q=>q.id===qid);
  if(q) showSectionQuestion();
}
function removeFile(qid, idx){
  state.uploadedFiles[qid].splice(idx,1);
  const q = getAllQuestions().find(q=>q.id===qid);
  if(q) showSectionQuestion();
}

// ═══════════════════════════════════════════════════════
//  INPUT HANDLERS
// ═══════════════════════════════════════════════════════
function onTextQ(id){ state.answers[id]=(document.getElementById('qInput')?.value||'').trim(); updateContinueState(getCurrentQ()); }
function selectOpt(id, label){
  state.answers[id]=label;
  updateContinueState(getCurrentQ());
  document.querySelectorAll('.opt-card').forEach(c=>c.classList.remove('selected'));
  document.querySelectorAll('.opt-card').forEach(c=>{ if(c.querySelector('.opt-card-label')?.textContent===label) c.classList.add('selected'); });
  const otherRow=document.getElementById('other-row-'+id);
  if(otherRow){
    if(label==='Other'){ otherRow.style.display='block'; setTimeout(()=>document.getElementById('other-input-'+id)?.focus(),80); }
    else { otherRow.style.display='none'; delete state.otherInputs[id]; }
  }
  if(label!=='Other') setTimeout(goForward, 320);
}
function toggleChipQ(id, el, label){
  el.classList.toggle('selected');
  const vals=[...document.querySelectorAll('.chip-opt.selected')].map(c=>c.textContent.trim().replace('✓','').trim());
  state.answers[id]=vals;
  updateContinueState(getCurrentQ());
  const otherRow=document.getElementById('other-row-'+id);
  if(otherRow){
    if(vals.includes('Other')){ otherRow.style.display='block'; setTimeout(()=>document.getElementById('other-input-'+id)?.focus(),80); }
    else { otherRow.style.display='none'; delete state.otherInputs[id]; }
  }
}
function onOtherInput(id, val){ state.otherInputs[id]=val; }
function selectYN(id, val){
  state.answers[id]=val;
  document.querySelectorAll('.yn-card').forEach(c=>c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  updateContinueState(getCurrentQ());
  setTimeout(goForward, 320);
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function goForward(){
  if(state.phase==='contact'){
    const q = MANDATORY_Q[state.contactIdx];
    if(q.required && !state.answers[q.id]) return;
    if(state.contactIdx < MANDATORY_Q.length-1){ state.contactIdx++; animateAndRun(showContactStep); }
    else animateAndRun(showIndustryScreen);
    return;
  }
  if(state.phase==='sections'){
    if(state.questionIdx===-1){
      state.questionIdx=0;
      animateAndRun(showSectionQuestion);
      return;
    }
    state.questionIdx++;
    const section = state.sections[state.sectionIdx];
    if(state.questionIdx >= section.questions.length){
      state.sectionIdx++;
      if(state.sectionIdx >= state.sections.length){ animateAndRun(renderWebsitePreview); }
      else { state.questionIdx=-1; animateAndRun(showSectionIntro); }
    } else {
      animateAndRun(showSectionQuestion);
    }
    return;
  }
  if(state.phase==='preview'){ animateAndRun(renderCompletion); }
}

function goBack(){
  if(state.phase==='contact'){
    if(state.contactIdx===0) return;
    state.contactIdx--;
    animateAndRun(showContactStep);
  } else if(state.phase==='industry'){
    state.phase='contact';
    state.contactIdx=MANDATORY_Q.length-1;
    document.getElementById('footerNav').style.display='flex';
    animateAndRun(showContactStep);
  } else if(state.phase==='sections'){
    if(state.questionIdx===-1){
      if(state.sectionIdx===0) animateAndRun(showIndustryScreen);
      else { state.sectionIdx--; state.questionIdx=state.sections[state.sectionIdx].questions.length-1; animateAndRun(showSectionQuestion); }
    } else if(state.questionIdx===0){
      state.questionIdx=-1; animateAndRun(showSectionIntro);
    } else {
      state.questionIdx--; animateAndRun(showSectionQuestion);
    }
  } else if(state.phase==='preview'){
    state.phase='sections';
    state.sectionIdx=state.sections.length-1;
    state.questionIdx=state.sections[state.sectionIdx].questions.length-1;
    document.getElementById('footerNav').style.display='flex';
    animateAndRun(showSectionQuestion);
  }
}

function skipStep(){
  if(state.phase==='contact'){
    const q=MANDATORY_Q[state.contactIdx];
    if(!q.skippable) return;
    state.skipped.add(q.id);
    goForward(); return;
  }
  if(state.phase==='sections'){
    if(state.questionIdx===-1){
      // Skip entire section
      state.sections[state.sectionIdx].questions.forEach(q=>state.skipped.add(q.id));
      state.sectionIdx++;
      if(state.sectionIdx>=state.sections.length) animateAndRun(renderWebsitePreview);
      else { state.questionIdx=-1; animateAndRun(showSectionIntro); }
    } else {
      const q=getCurrentQ();
      if(q) state.skipped.add(q.id);
      state.questionIdx++;
      const section=state.sections[state.sectionIdx];
      if(state.questionIdx>=section.questions.length){
        state.sectionIdx++;
        if(state.sectionIdx>=state.sections.length) animateAndRun(renderWebsitePreview);
        else { state.questionIdx=-1; animateAndRun(showSectionIntro); }
      } else animateAndRun(showSectionQuestion);
    }
  }
}

function animateAndRun(fn){
  const el=document.querySelector('.step-content');
  if(el){ el.style.opacity='0'; el.style.transform='translateY(-10px)'; }
  setTimeout(fn, 180);
}

// ═══════════════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════════════
function getTotalProgressSteps(){
  const sectionSteps = state.sections.reduce((s,sec)=>s+sec.questions.length+1,0);
  return MANDATORY_Q.length + 1 + sectionSteps;
}
function getSectionProgress(){
  let p = MANDATORY_Q.length + 1;
  for(let i=0;i<state.sectionIdx;i++) p += state.sections[i].questions.length + 1;
  if(state.questionIdx===-1) return p;
  return p + 1 + state.questionIdx;
}
function updateProgressBar(current, total, phase){
  const pct = Math.round((current/total)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `Step ${current+1} of ${total}`;
  const badge=document.getElementById('phaseBadge');
  if(phase==='mandatory'){ badge.className='phase-badge mandatory'; badge.textContent='Required'; }
  else { badge.className='phase-badge optional'; badge.textContent='Optional'; }
}
function updateContinueState(q){
  const btn=document.getElementById('btnContinue');
  if(!btn||!q) return;
  btn.textContent = 'Continue →';
  if(q.required) btn.disabled=!hasAnswer(q.id);
  else btn.disabled=false;
}
function hasAnswer(id){
  const v=state.answers[id];
  if(!v) return false;
  if(Array.isArray(v)) return v.length>0;
  return String(v).trim().length>0;
}
function getCurrentQ(){ return state.sections[state.sectionIdx]?.questions[state.questionIdx]; }
function getAllQuestions(){ return state.sections.flatMap(s=>s.questions); }

// ═══════════════════════════════════════════════════════
//  SUBMIT & EXPORT
// ═══════════════════════════════════════════════════════
function buildPayload(){
  const logoFiles=(state.uploadedFiles['logo_upload']||[]).map(f=>({name:f.name,size:f.size,type:f.type}));
  const assetFiles=(state.uploadedFiles['assets_upload']||[]).map(f=>({name:f.name,size:f.size,type:f.type}));
  return {
    session_id:'vai_'+Date.now(),
    submitted_at:new Date().toISOString(),
    platform:'vAI Onboarding v3 — AI Architect',
    ai_generated: state.aiGenerated,
    business:{
      registered_name:state.answers['registered_name'],
      official_email:state.answers['official_email'],
      official_phone:state.answers['official_phone'],
      whatsapp:state.answers['whatsapp']||state.answers['official_phone'],
      description:state.answers['biz_description'],
      industry:state.industry?.displayName,
      industry_category:state.industry?.cat,
    },
    website_sections: state.sections.map(s=>({
      id:s.id, title:s.title, icon:s.icon,
      questions_answered: s.questions.filter(q=>hasAnswer(q.id)&&!state.skipped.has(q.id)).length,
      questions_total: s.questions.length,
    })),
    section_responses: Object.fromEntries(state.sections.map(section=>[
      section.id,
      Object.fromEntries(section.questions.map(q=>[q.id,{
        question:q.question,
        answer:state.answers[q.id]||null,
        other_text:state.otherInputs[q.id]||null,
        skipped:state.skipped.has(q.id),
      }]))
    ])),
    online_presence:state.answers['online_presence']||{},
    uploaded_assets:{ logo:logoFiles, brand_assets:assetFiles },
    meta:{
      duration_seconds:Math.round((Date.now()-state.startTime)/1000),
      total_sections:state.sections.length,
      questions_answered:Object.keys(state.answers).filter(k=>!state.skipped.has(k)&&hasAnswer(k)).length,
      questions_skipped:state.skipped.size,
    }
  };
}
function submitForm(){
  const p=buildPayload();
  console.log('vAI onboarding payload v3:', p);
  alert('Submitted! ✓\n\nIn production this posts to your CRM or project management system.\nCheck the browser console for the full JSON blueprint.');
}
function exportJSON(){
  const p=buildPayload();
  const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`vai_blueprint_${(state.industry?.displayName||'unknown').replace(/\s+/g,'_')}_${Date.now()}.json`;
  a.click();
}
function startOver(){
  state={phase:'contact',contactIdx:0,industry:null,sectionIdx:0,questionIdx:-1,sections:[],answers:{},skipped:new Set(),uploadedFiles:{},otherInputs:{},startTime:Date.now(),aiGenerated:false};
  indSelected=null; indSearch=''; indCat='All'; otherText='';
  init();
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function findFirstAnswer(keys){
  for(const k of keys){
    if(state.answers[k] && hasAnswer(k)) return String(state.answers[k]);
    // search all section questions by partial ID match
    for(const sec of state.sections){
      const q=sec.questions.find(q=>keys.some(key=>q.id.includes(key)));
      if(q && state.answers[q.id] && hasAnswer(q.id)) return String(state.answers[q.id]);
    }
  }
  return null;
}
function findFirstAnswerArray(keys){
  for(const k of keys){
    const v=state.answers[k];
    if(v && Array.isArray(v) && v.length) return v;
    if(v && typeof v==='string' && v.trim()) return v.split(',').map(s=>s.trim()).filter(Boolean);
    for(const sec of state.sections){
      const q=sec.questions.find(q=>keys.some(key=>q.id.includes(key)));
      if(q){
        const val=state.answers[q.id];
        if(val && Array.isArray(val) && val.length) return val;
        if(val && typeof val==='string' && val.trim()) return val.split(',').map(s=>s.trim()).filter(Boolean);
      }
    }
  }
  return [];
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    const activeEl=document.activeElement;
    if(activeEl&&activeEl.tagName==='TEXTAREA') return;
    if(activeEl&&activeEl.tagName==='INPUT'){ e.preventDefault(); goForward(); }
  }
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
init();
</script>
